<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Casas de Hogwarts</title>
</head>
<body>

    <!-- 1. ESCUDO SVG (GRIFINÓRIA) -->
    <h3>GRIFINÓRIA</h3>
    <svg viewBox="0 0 120 120" width="120" height="120" role="img">
        <title id="tituloEscudo">Escudo Grifinória</title>
        <path 
            d="M60 5 L115 25 V75 C115 85 90 95 60 95 C30 95 5 85 5 75 V25 Z" 
            fill="#740001" 
            stroke="#D3A625" 
            stroke-width="5" 
        />
    </svg>

    <hr>

    <!-- 2. ESCUDO CANVAS (SONSERINA) -->
    <h3>SONSERINA</h3>
    <a href="https://harrypotter.fandom.com/pt-br/wiki/Sonserina">Sonserina</a>
    <br><br>
    
    <canvas id="escudoSonserina" width="200" height="200"></canvas>

    <!-- CÓDIGO JAVASCRIPT QUE DESENHA NO CANVAS -->
    <script>
        const canvas = document.getElementById('escudoSonserina');
        const ctx = canvas.getContext('2d');

        // Cria a forma do escudo
        const escudo = new Path2D();
        escudo.moveTo(100, 10);      
        escudo.lineTo(190, 45);      
        escudo.lineTo(190, 130);     
        escudo.bezierCurveTo(190, 150, 150, 170, 100, 170); 
        escudo.bezierCurveTo(50, 170, 10, 150, 10, 130);  
        escudo.lineTo(10, 45);       
        escudo.closePath();          

        // Preenchimento Verde da Sonserina
        ctx.fillStyle = '#0F5F2C'; 
        ctx.fill(escudo);

        // Borda Prata da Sonserina
        ctx.strokeStyle = '#CCCCCC'; 
        ctx.lineWidth = 6;
        ctx.stroke(escudo);
    </script>

</body>
</html>
